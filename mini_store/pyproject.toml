[tool.ruff]
exclude = [
    "**/migrations/*",
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]

ignore = [
    "EXE001",
    "EXE002", 
    "RUF012", 
]
[tool.mypy]
plugins = [
    "mypy_django_plugin.main"
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "mini_store.settings"

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true